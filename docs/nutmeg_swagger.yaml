      tags:
      - matches
    post:
      consumes:
      - application/json
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Match
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.MatchWriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
