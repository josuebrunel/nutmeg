basePath: /api/v1
definitions:
  api.AccountResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      username:
        type: string
    type: object
  api.AccountUpdateRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      username:
        type: string
    type: object
  api.DashboardResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/api.GroupResponse'
        type: array
      stats:
        $ref: '#/definitions/api.GlobalStatsResponse'
    type: object
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  api.GlobalStatsResponse:
    properties:
      total_assists:
        type: integer
      total_draws:
        type: integer
      total_goals:
        type: integer
      total_matches:
        type: integer
      total_players:
        type: integer
    type: object
  api.GroupCreateRequest:
    properties:
      name:
        type: string
    type: object
  api.GroupResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  api.GroupUpdateRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  api.JoinRequestResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  api.LeaderboardEntryResponse:
    properties:
      assists:
        type: integer
      draws:
        type: integer
      goals:
        type: integer
      id:
        type: string
      losses:
        type: integer
      matches:
        type: integer
      name:
        type: string
      wins:
        type: integer
    type: object
  api.MatchDetailResponse:
    properties:
      assists:
        additionalProperties:
          type: integer
        type: object
      goals:
        additionalProperties:
          type: integer
        type: object
      group_id:
        type: string
      match_id:
        type: string
      played_at:
        type: string
      score_a:
        type: integer
      score_b:
        type: integer
      team_a_name:
        type: string
      team_a_players:
        items:
          type: string
        type: array
      team_b_name:
        type: string
      team_b_players:
        items:
          type: string
        type: array
    type: object
  api.MatchResponse:
    properties:
      group_id:
        type: string
      id:
        type: string
      played_at:
        type: string
      score_a:
        type: integer
      score_b:
        type: integer
      team_a_name:
        type: string
      team_b_name:
        type: string
    type: object
  api.MatchWriteRequest:
    properties:
      assists:
        additionalProperties:
          type: integer
        type: object
      goals:
        additionalProperties:
          type: integer
        type: object
      played_at:
        type: string
      score_a:
        type: integer
      score_b:
        type: integer
      team_a_name:
        type: string
      team_a_players:
        items:
          type: string
        type: array
      team_b_name:
        type: string
      team_b_players:
        items:
          type: string
        type: array
    type: object
  api.MemberAddRequest:
    properties:
      email:
        type: string
      names:
        items:
          type: string
        type: array
      phone:
        type: string
    type: object
  api.MemberImportRequest:
    properties:
      rows:
        items:
          $ref: '#/definitions/api.MemberImportRow'
        type: array
    type: object
  api.MemberImportResponse:
    properties:
      imported:
        type: integer
      skipped:
        type: integer
      updated:
        type: integer
    type: object
  api.MemberImportRow:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  api.MemberResponse:
    properties:
      email:
        type: string
      id:
        type: string
      joined_at:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  api.MemberUpdateRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  api.PasswordChangeRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  api.PlayerProfileResponse:
    properties:
      assists:
        type: integer
      commentary:
        type: string
      draws:
        type: integer
      goals:
        type: integer
      group_id:
        type: string
      id:
        type: string
      losses:
        type: integer
      matches_played:
        type: integer
      name:
        type: string
      wins:
        type: integer
    type: object
info:
  contact: {}
  description: JSON API for Nutmeg, a self-hosted pickup-soccer stats tracker.
  title: Nutmeg API
  version: "1.0"
paths:
  /account:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account
      tags:
      - account
    patch:
      consumes:
      - application/json
      parameters:
      - description: Account fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AccountUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update account
      tags:
      - account
  /account/password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Password change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PasswordChangeRequest'
      responses:
        "204":
          description: no content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - account
  /dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DashboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard data
      tags:
      - home
  /groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.GroupResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      parameters:
      - description: Group
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.GroupCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.GroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a group
      tags:
      - groups
  /groups/{id}:
    delete:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: no content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a group
      tags:
      - groups
    get:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
