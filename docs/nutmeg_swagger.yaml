  /groups/{id}/leaderboard:
    get:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.LeaderboardEntryResponse'
